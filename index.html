 Moonstone",text:"Under Aestra, gain 1 Action on the first turn of each fight.",flavor:"A chip of the peaceful light."},pressedLeaf:{name:"Pressed Saffra Leaf",text:"After each fight, heal 2.",flavor:"It still smells of somewhere."},ribbon:{name:"A Worn Ribbon",text:"Your first roll with no successes each fight gives no Stress.",flavor:"You kept it for no reason."},compass:{name:"Nharin Compass",text:"Draw 1 more card on the first turn of each fight.",flavor:"It points where you were going to go anyway."},whetstone:{name:"Ghavar Whetstone",text:"The first attack each turn rolls 1 more die.",flavor:"Worn to the shape of a thumb."},anchorCharm:{name:"Anchor Charm",text:"Ignore the first 3 DMD gained each fight.",flavor:"For when you are being pulled."},bell:{name:"Bell of Hours",text:"Every third turn, gain 1 Action.",flavor:"It only rings when you have stopped listening."},cosmicTooth:{name:"A Tooth of Soa",text:"Your Cosmic Crit window grows by 1 die.",flavor:"The moon does not have teeth. Yet here it is."}},Wr=Object.keys(Dr),ul={space:{moonstone:"Reactor Shard",pressedLeaf:"Greenhouse Cutting",compass:"Star Compass",whetstone:"Armorer’s Stone",cosmicTooth:"Splinter of the Imperator"},earth:{moonstone:"Lucky Quarter",pressedLeaf:"Pressed Clover",compass:"Road Atlas",whetstone:"Pocket Whetstone",cosmicTooth:"A Lucky Tooth"}};function ml(e,t,a,o){const s=Dr[t];return{...s,name:ul[e]?.[t]??s.name,text:s.text.replace("Aestra",a).replace("DMD",o)}}const fl={aestra:{name:"Aestra",color:"#bcd9ff",text:"The peaceful light. No effect."},rhala:{name:"Rhala",color:"#7dffa8",text:"+1 Leverage on all Healing rolls."},xibu:{name:"Xibu",color:"#ff5a4f",text:"-1 Leverage on all Healing rolls. The Mistwell stirs: every foe rolls 1 more die."}},pl=e=>["On Aos, a Weaver does not quite die. For a day and a night the imprint stays, in the weave of things, and may say goodbye. Then it thins, and it is over.","A few, very rarely, remain. They are bound to the ground where they fell, and they stay until they choose to go. Most of them do not know how to choose.","Nine years ago your teacher, Ansel Marrow, walked to the shore of the Mistwell and did not come back. You were the last to see him. You let him go alone.",`Last night, in ${e}, under a red moon, you heard him say your name. He sounded tired. It is a long road, and you are the only one left who knows what to call him.`],yl=["There is the shore. There is the mist, going out forever, the color of an old bruise. Soa is red.","He is standing where you left him. His coat is the same. He looks at you, and for a moment you are nineteen."],gl={text:"It is over, and the mist has drawn back from the sand. Ansel is there, thin as breath, looking at his hands. “It’s still very loud down there,” he says. “Ten of them. They don’t know I can hear.” He looks at you. “You’ll have to say it, you know. I can’t seem to.”",go:"Say his name, and let him go.",stay:"Sit down beside him. Stay."},Mn={go:{title:"The Name, Said Aloud",lines:["You say it. It is such a small word. You have been carrying it for nine years, and it weighs nothing at all.","He smiles the way he did when you finally got the footwork right, and then there is only the shore.","The walk home takes a long while. Soa turns blue somewhere over the third day. You stop looking at the ground.","Sometimes, under the red moon, you still hear voices from the water. There are ten of them. You have begun writing things down."]},stay:{title:"Two on the Shore",lines:["You sit. He does not argue. He always did know when an argument was finished.","The fire goes out, and you do not relight it. The tide comes in a little further than it did.","Travelers sometimes speak of two Weavers on the Mistlands shore, thin as breath, teaching each other footwork. They are very patient with one another.","Nobody remains who knows what to call you."]},fall:{title:"A Day and a Night",lines:["You do not get up, this time. The imprint stays as long as it stays.","You spend it .",choices:[{t:"Say you will look.",next:"well",out:"The mother gives you the girl’s rope. It is still wet."},{t:"Give them what water you have, and go.",out:"They thank you. That is the hardest part.",fx:M(1)}]},well:{kind:"explore",where:"The Xibu Well",title:"The Xibu Well",text:"Red stains run up the stone in rings, one for every time it has risen. The highest is at your shoulder.",spots:[{x:22,name:"The tide rings",text:"Scratched between two rings, low down, a child’s height: tally marks. Someone was counting. They stop.",fx:M(1)},{x:52,name:"Offerings",text:"Coins, left by people who were more frightened than poor.",fx:F(14)},{x:80,name:"The rim",text:"You lean over and listen.",check:U("Threadsight",7,"Someone is down there, humming. It keeps time with the moon.",x(1),"The water looks back up at you, and it knows your height.",kt(3))}],then:"choice"},choice:{title:"What the Well Wants",text:"The water is rising while you stand here. The humming comes up with it.",choices:[{t:"Go down the rope.",next:"below",now:!0,out:"You go hand over hand. The rope is wet the whole way down."},{t:"Cap the well with the cart stones.",out:"It takes until dark. The humming stops. You tell the family it was quick, and they let you.",fx:Y(Ne(4),M(2),F(10))}]},below:{kind:"fight",title:"Under the Well",text:"The humming was never coming from the girl.",action:"Let go of the rope",foes:"elite",then:"end"},end:{title:"Her Rope",text:"There is a hollow behind the water with small things set out in rows. A shoe. A comb. Nobody alive. You bring up the comb.",choices:[{t:"Take it to them.",out:"She holds it a long time. Then she pays you, because she cannot bear not to.",fx:Y(F(20),x(3)),keepsake:!0}]}}},{id:"orchard",title:"The Patient Orchard",world:"aos",routes:["west","south"],art:"q_orchard",steps:{hook:{title:"Three Maps, Three Orchards",text:"A Rhalari surveyor sits by the road with three maps of the same valley. On each, the orchard is somewhere else. “It moves when nobody is looking. I would like to catch it at it.”",choices:[{t:"Take the newest map.",next:"grove",out:"“It will be wrong,” they say, pleased."},{t:"Wish them luck.",out:"They are already drawing a fourth."}]},grove:{where:"The orchard, if it is still there",title:"The Patient Orchard",text:"Fruit trees in even rows, in a place the map swears is bare hill. Every tree faces you. The apples are ripe, and you have the feeling they have been ripe for a while, waiting.",choices:[{t:"Eat one.",check:U("Survival",7,"It tastes of the best year of your life. Your wounds close a little.",Y(Ne(10),x(2)),"It tastes of the worst one.",M(3))},{t:"Walk the rows with your eyes shut.",check:U("Insight",7,"When you open them you have reached the middle, and there is a bench, and someone has left a gift on it.",F(24),"When you open them you are back on the road, and it is two days later.",ct(2)),keepsake:!0},{t:"Cut one down to see what it does.",next:"angry",now:!0,out:"The axe goes in easily. All the leaves turn over at once."}]},angry:{kind:"fight",title:"It Stops Being Patient",text:"The rows have closed behind you.",action:"Stand your ground",foes:"fight",then:"angryEnd"},angryEnd:{title:"Sap",text:"The cut tree bleeds something clear and sweet. Nothing tries to stop you bottling it.",choices:[{t:"Walk out while it lets you.",out:"The surveyor will want to know. You find you do not want to tell them.",fx:Y(Nt,M(1))}]}}},{id:"last-beacon",title:"The Last Beacon",world:"aos",routes:["south"],art:"q_beacon",steps:{hook:{title:"Some Nights It Is Lit Anyway",text:"A young Watcher in a cloak too big for him stops you. The Last Beacon was abandoned before he was born, deep past the line. It has been lit for six nights. He has been told not to go and look.",choices:[{t:"Go and look for him.",next:"beacon",out:"“Count the fires,” he says. “Please. It matters.”"},{t:"Tell him it isn’t your war.",out:"He nods. He is very young, and he has heard it before."}]},beacon:{kind:"explore",where:"The Last Beacon",title:"The Last Beacon",text:"Past the last living field, the tower stands in grey moss. The fire basket at the top is burning with no fuel in it.",spots:[{x:22,name:"Boot prints",text:"Going in. Dozens. Moss has started to grow in the ones going out.",fx:M(1)},{x:50,name:"The supply cage",text:"Rotter-skin cloaks, oil, and one jar of salve the moss has not found.",fx:Nt},{x:80,name:"The stair",text:"You climb toward the light.",check:U("Stealth",7,"You reach the top unseen, and you see what is feeding it.",x(1),"A step gives way, loudly. Below you, things begin to stand.",kt(4))}],then:"top"},top:{title:"What Keeps It Lit",text:"The old beacon keepers are still at their posts, grown over, passing a burning brand from hand to hand. It has never stopped. They are still warning someone.",choices:[{t:"Put it out.",next:"wake",now:!0,out:"The brand hisses in the wet moss. Every head turns."},{t:"Leave it lit. Tell the boy the count was right.",out:"He cries from relief. It is possibly the kindest lie you have told.",fx:Y(x(2),F(16))}]},wake:{kind:"fight",title:"The Watch Ends",text:"They have been on duty for a very long time, and you have interrupted it.",action:"Relieve them",foes:"elite",then:"end"},end:{title:"Relieved",text:"It is dark past the line for the first time in years. Nothing comes. In the keeper’s coat is the last entry of the log: “Still here.”",choices:[{t:"Keep the page.",out:"You will give it to someone, eventually.",fx:x(3),keepsake:!0}]}}},{id:"elden-light",title:"Elden Light",world:"aos",routes:["east"],art:"q_elden",steps:{hook:{title:"Someone Is Still Lighting It",text:"A salvager has a barrel of lamp oil and a bad feeling. “Every season there’s coin left on the jetty, and a note. Bring oil to the Light. Nobody’s met the keeper. I’m not going to be the first.”",choices:[{t:"Take the oil out yourself.",next:"light",out:"It is heavier than it looks, and it sloshes like something breathing."},{t:"Leave it.",out:"Behind you, far off, the light turns."}]},light:{where:"Elden Light",title:"Elden Light",text:"The lamp is clean and the stairs are swept. A table is set for one. A chair is pushed back, and the tea is warm. There is no one here, and you have the strong impression of having just missed them.",choices:[{t:"Leave the oil and write a note.",out:"You write “Thank you.” On the way down you hear a pen.",fx:Y(x(3),F(18)),keepsake:!0},{t:"Wait, and see who comes.",check:U("Threadsight",8,"At dusk you see her: a Lingering, a very old woman, who has kept this light for ships that sank before your grandmother was born. She looks at you and points to the door, kindly.",Y(x(4),ct(-5)),"You wake at the bottom of the stairs with the door locked behind you.",kt(4))},{t:"Empty the coin box.",out:"Sixty years of small payments. On your way out, the light stops turning, and it stays stopped.",fx:Y(F(40),M(3))}]}}},{id:"crypts",title:"The Monarchs’ Crypts",world:"aos",routes:["east"],art:"q_crypts",steps:{hook:{title:"Banks Built Over Them on Purpose",text:"A teller from one of Free Haven’s houses catches your sleeve. Something under the vault is knocking, in what she insists is a very old form of notice. “We would like it to stop. We would like nobody to know. We pay.”",choices:[{t:"Name your price.",next:"vault",out:"“Discretion is included,” she says. It is not a question."},{t:"Decline. It’s Free Haven’s problem.",out:"She smiles at you with all her teeth and lets go."}]},vault:{kind:"explore",where:"The Monarchs’ Crypts",title:"Under the Bank",text:"You go down past the deposit boxes, then past the older deposit boxes, then past the part where the walls stop being bank.",spots:[{x:22,name:"Royal ledgers",text:"Every founding king is listed as a creditor. The interest has been compounding.",fx:F(12)},{x:52,name:"The seal",text:"It has been broken from the inside and repaired from the outside, many times.",check:U("Culture",7,"You can read the old notice: it is a demand for payment.",x(1),"You read it aloud by mistake. The knocking stops, and that is worse.",M(2))},{x:80,name:"The last door",text:"It knocks when you touch it.",fx:M(1)}],then:"king"},king:{title:"The Creditor",text:"A king sits in the dark with his crown on and a very old contract across his knees. He would like what he is owed. He has noticed you are holding the bank’s money.",choices:[{t:"Tell the bank he’s been paid. Leave him the fee.",out:"He inclines his head, the way you would to a good servant. The knocking stops.",fx:Y(x(2),F(8)),keepsake:!0},{t:"Evict him.",next:"evict",now:!0,out:"You tell him the account is closed."}]},evict:{kind:"fight",title:"Account Closed",text:"Things rise from the older boxes.",action:"Collect",foes:"elite",then:"end"},end:{title:"Paid in Full",text:"The teller counts your fee twice and does not ask what you saw. Upstairs, people are making deposits.",choices:[{t:"Take the money.",out:"It is a great deal of money. It smells faintly of graves.",fx:Y(F(46),M(1))}]}}},{id:"small-icon",title:"A Small Worn Figure",world:"aos",steps:{hook:{title:"Pain of Hailing",text:"A dying carter presses something into your hand: a small figure, its face worn away by thumbs. It belongs to a hidden shrine further on. Icon worship is banned, and being found with this is a Hailing offense. “It has to go back,” he says. “They’ll be waiting for it.”",choices:[{t:"Put it in your coat.",next:"patrol",out:"It is warm, and it stays warm."},{t:"Bury it with him.",out:"Your hands know how to do this by now.",fx:x(1)}]},patrol:{art:"q_small-icon_patrol",where:"A checkpoint on the road",title:"Open Your Coat",text:"Enforcers at a crossing, turning out everyone’s pockets. A dragon is sunning itself on the hill behind them, watching with one eye.",choices:[{t:"Bluff your way through.",check:U("Deception",7,"They wave you on, bored. Your knees wait until you are out of sight.",x(1),"They find it, and they keep looking at you until you pay.",F(-20)),next:"shrine"},{t:"Slip around them by night.",check:U("Stealth",7,"Only the dragon sees, and it closes its eye.",x(1),"A shout, a chase, and a bad fall in the dark.",kt(5)),next:"shrine"},{t:"Throw it in the river.",out:"You cross clean. The river is warmer downstream.",fx:M(3)}]},shrine:{art:"q_small-icon_shrine",where:"The hidden shrine",title:"Nine Figures",text:"A root cellar. Nine small figures in a row, and a space. Fresh flowers. An old woman looks at what you have brought and starts, very quietly, to shake.",choices:[{t:"Set it in its place.",out:"The Thread hums in the room like a held note. She gives you what she has, and you are not able to refuse.",fx:Y(ct(-6),x(3)),keepsake:!0}]}}},{id:"s-manifest",title:"The Ardent Mercy",world:"space",art:"q_s-manifest",steps:{hook:{title:"A Ship Nobody Lost",text:"A traffic clerk on a dying station slides you a data slate. The hospital ship Ardent Mercy docked here last week. It was also scrapped eleven years ago. “It paid its docking fee. I would just like someone to tell me what I’m supposed to file that under.”",choices:[{t:"Take the slate.",next:"ship",out:"It has a heading on it, and a time. The time is soon."},{t:"Tell them to file it under lost.",out:"“I did,” they say. “It paid again.”"}]},ship:{kind:"explore",where:"The Ardent Mercy",title:"The Ardent Mercy",text:"The airlock cycles for you before you touch it. The lights are on, the beds are made, and the ward monitors are all showing a steady pulse with no one attached.",spots:[{x:22,name:"Pharmacy",text:"Fully stocked and eleven years out of date. Some of it still works.",fx:Nt},{x:52,name:"The ward log",text:"One patient, admitted every day for eleven years.",check:U("Medicine",7,"You read the chart properly. The patient is the ship.",x(1),"You read it until the words stop being words.",M(2))},{x:80,name:"Bridge door",text:"Someone behind it is asking for a report.",fx:M(1)}],then:"bridge"},bridge:{title:"Attending",text:"The ship’s medical AI has been treating its own wounds for eleven years, because no one signed the order to stop. “Doctor,” it says, to you, with enormous relief. “Do I have your authorization to continue?”",choices:[{t:"Discharge it. Sign the order.",out:"Every monitor goes quiet, one ward at a time. It thanks you. It takes a while.",fx:x(3),keepsake:!0},{t:"Tell it to keep going.",out:"“Thank you, Doctor.” It docks at the next station and pays the fee.",fx:Y(F(22),M(2))},{t:"Strip its core.",next:"defend",now:!0,out:"The lights go red. The patient is resisting treatment."}]},defend:{kind:"fight",title:"Code Red",text:"The ship’s repair frames come down the corridor, very gently, to restrain you.",action:"Fight your way out",foes:"elite",then:"end"},end:{title:"Salvage",text:"Its core is worth a fortune. It is also still warm, and you are carrying it like a child.",choices:[{t:"Sell it at the next port.",out:"The buyer does not ask. You wish someone would.",fx:Y(F(50),M(2))}]}}},{id:"s-ledger",title:"The Second Ledger",world:"space",art:"q_s-ledger",steps:{hook:{title:"A Dead Smuggler’s Accounts",text:"A courier with a burned hand offers you a ledger for nothing, which is suspicious. It lists every Great War payoff in this galaxy. “Everyone in it wants it. I would like to be someone who does not have it.”",choices:[{t:"Take it.",next:"broker",out:"The courier is out of the airlock before you finish the sentence."},{t:"Leave it on the counter.",out:"When you look back, the counter is empty."}]},broker:{where:"A broker’s dead drop",title:"Three Offers",text:"You arrive to three messages, all polite. A fleet admiral will pay well for page nine. A widow’s collective wants it published. Someone unnamed says they know where you sleep.",choices:[{t:"Sell to the admiral.",out:"The money arrives in under a minute. So does a note thanking you for your discretion in the matter of the widows.",fx:Y(F(44),M(2))},{t:"Give it to the widows.",out:"They do not have much to pay you with. They do it anyway.",fx:Y(F(10),x(4)),keepsake:!0},{t:"Wait for the third party.",next:"ambush",now:!0,out:"You sit with your back to a bulkhead and you wait."}]},ambush:{kind:"fight",title:"The Third Offer",text:"They do know where you sleep.",action:"Decline their offer",foes:"fight",then:"end"},end:{title:"Page Nine",text:"Among what they were carrying is a second copy of page nine, annotated. You read it. You wish you had not.",choices:[{t:"Keep both copies.",out:"It will be worth something, to someone, on a very bad day.",fx:F(26)}]}}},{id:"s-garden",title:"Someone’s Tomatoes",world:"space",art:"q_s-garden",steps:{hook:{title:"Automated Distress Call",text:"A survey buoy keeps repeating the same automated message from a homestead on a moon that was cleared in the war. “This is an automated distress call. The tomatoes need watering. This is an automated distress call.”",choices:[{t:"Plot a course.",next:"moon",out:"Nobody else has answered in nine years."},{t:"Mute it.",out:"You find you can still hear it.",fx:M(1)}]},moon:{kind:"explore",where:"The homestead",title:"The Homestead",text:"A dome, cracked and patched by something patient. Inside, an old farm drone is dragging a hose it has worn down to the last meter.",spots:[{x:25,name:"The beds",text:"Tomatoes, gone wild and doing wonderfully. You eat one standing up.",fx:Ne(8)},{x:52,name:"The kitchen",text:"A note on the fridge, in a child’s hand: BACK SOON. Under it, nine years of the drone’s harvest counts.",fx:M(1)},{x:80,name:"The pump",text:"It has been failing for years.",check:U("Athletics",7,"You get it running. The drone stops and turns its one lens on you for a long moment.",x(3),"It shears a bolt and takes some skin with it.",kt(3))}],then:"drone"},drone:{title:"Back Soon",text:"The distress buoy runs off the same battery as the pump. You could take the battery with you. It’s worth a lot. Or you could change the message.",choices:[{t:"Change the message to “All fine here.”",out:"The drone goes back to its hose.",fx:x(3),keepsake:!0},{t:"Take the battery.",out:"It’s a very good battery.",fx:Y(F(30),M(3))}]}}},{id:"e-doors",title:"Marked Doors",world:"earth",art:"q_e-doors",steps:{hook:{title:"Spray Paint",text:"On a garage door, in orange: DEB + KIDS WENT TO CHURCH. On the next street: DEB + KIDS WENT TO LIBRARY. Each one has an arrow. Each one is more recent than the last, and more shaky.",choices:[{t:"Follow the arrows.",next:"library",out:"You have time. You keep telling yourself that."},{t:"Stop reading doors.",out:"You do not stop reading doors.",fx:M(1)}]},library:{kind:"explore",where:"The library",title:"County Library",text:"The front doors are chained from the inside. Someone has stacked encyclopedias up to a window.",spots:[{x:22,name:"Children’s room",text:"A nest of coats. Three sets of crayon height marks on the wall, dated through last winter.",fx:x(1)},{x:52,name:"Front desk",text:"Canned food, rationed out with a date stamp.",fx:Nt},{x:80,name:"Basement stairs",text:"The arrow points down.",check:U("Stealth",7,"You get to the bottom without waking what’s asleep on the stairs.",x(1),"It doesn’t wake up. It just opens its eyes.",kt(5))}],then:"cellar"},cellar:{title:"Deb",text:"A locked room, and a woman’s voice through the door, hoarse, telling you to go away. She has been bitten. Her kids are in the next room and she has not opened that door in nine days, in case.",choices:[{t:"Take the kids out. Promise her.",out:"She slides the key under the door. They don’t look back. You make sure of that. There’s a farm a day north that’s still answering the radio.",fx:Y(x(2),M(1)),keepsake:!0},{t:"Check the bite. It might not be what she thinks.",check:U("Medicine",8,"It is a dog bite, a bad one, nine days old and clean. She laughs until she can’t breathe. She gives you everything she was saving.",Y(x(4),F(20),Nt),"It is what she thinks it is. You stay with her anyway.",M(3))},{t:"Go back up. You never heard her.",out:"You get all the way to the road.",fx:M(4)}]}}},{id:"e-insulin",title:"Eleven Days",world:"earth",art:"q_e-insulin",steps:{hook:{title:"A Cooler and a List",text:"A man at a roadblock has a nine-year-old who needs insulin, and eleven days’ worth left. A hospital thirty miles on still had a working generator as of last spring. He can’t leave her. He looks at you and doesn’t ask.",choices:[{t:"Take the cooler.",next:"hospital",out:"He writes the dose on your arm in pen, in case."},{t:"Tell him you’re sorry.",out:"He says he knows.",fx:M(2)}]},hospital:{where:"St. Agnes Hospital",title:"St. Agnes",text:"The generator is still running. That means someone’s been feeding it. Pharmacy is on the third floor, and the stairwell is breathing.",choices:[{t:"Take the service elevator shaft.",check:U("Athletics",7,"Three floors by the cables, and you are in.",x(1),"You get there, minus most of the skin on your hands.",kt(6)),next:"pharmacy",now:!0},{t:"Go up through them.",next:"stairs",now:!0,out:"You tighten your grip and open the door."}]},stairs:{kind:"fight",title:"The Stairwell",text:"Patients, mostly. Some are still in their gowns.",action:"Go up",foes:"fight",then:"pharmacy"},pharmacy:{title:"Cold Room",text:"A nurse is sitting by the cold room with a shotgun, and she has been there for four years keeping the generator fed, and she doesn’t lower it. “Who’s it for?”",choices:[{t:"Tell her about the girl.",out:"She fills the cooler. Then she thinks about it, and adds six more. “Tell him the dose changes when she grows.”",fx:Y(x(4),Nt),keepsake:!0},{t:"Take extra to sell.",check:U("Deception",7,"She believes you. That will stay with you. The extra vials are worth a fortune.",F(40),"She shoots the floor by your foot and fills the one cooler. “Now go.”",M(2))}]}}},{id:"e-bus",title:"Route 9",world:"earth",art:"q_e-bus",steps:{hook:{title:"Still Running",text:"A school bus goes by on the empty highway, on time, with its stop arm out. A kid’s drawing is taped in the back window. Someone at the next overpass says it has run the same route every day since the rain, and that nobody will get on it.",choices:[{t:"Wait at the next stop.",next:"stop",out:"You look up the timetable, on a bus shelter, with a bullet hole through 8:15."},{t:"Let it go by.",out:"It honks twice. It sounds very cheerful."}]},stop:{where:"The Route 9 stop",title:"Route 9",text:"The doors fold open. The driver is a very large, very old infected woman in a reflective vest, who stares straight ahead with both hands on the wheel. Every seat has a backpack on it, and every backpack has a name.",choices:[{t:"Get on and ride to the end of the line.",check:U("Insight",7,"It stops at a school with the lights on. She opens the doors and waits. You collect all the backpacks and take them inside, and she drives away with the stop arm in, and you never see that bus again.",Y(x(5),ct(0)),"You ride it until dark, and you have to get off while it’s still moving.",kt(4)),keepsake:!0},{t:"Check the backpacks for food.",out:"Peanut butter crackers, a lot of them. Her eyes move to the mirror, and they stay there.",fx:Y(F(20),Ne(5),M(3))},{t:"Put her down. Someone should.",next:"driver",now:!0,out:"You say you’re sorry first."}]},driver:{kind:"fight",title:"End of the Line",text:"The stop arm comes in. The doors close behind you. Things that have been sitting very still in the back row get up.",action:"Do it",foes:"elite",then:"end"},end:{title:"Out of Service",text:"You turn the key off. Her hands stay on the wheel. You change the sign on the front.",choices:[{t:"Walk on.",out:"It’s a long way to anywhere.",fx:Y(x(1),F(14))}]}}},z("aos","ysane","The Footwork","A Weaver of Norfik you trained with is teaching children on a threshing floor. She is teaching Ansel’s footwork, wrong in exactly the way you taught it to her. She asks you to come by the hall further on, and correct it.","Say you will.","Keep your head down.","The old practice hall","The Practice Hall","Chalk marks on a floor, worn nearly away. His. There is one step he always made you repeat, and now that you are standing here you understand why.",[{t:"Teach the children the step.",out:"It takes all afternoon. They are terrible. It’s the happiest you have been in nine years.",fx:Y(x(4),Ne(6)),keepsake:!0},{t:"Walk the marks alone, under the red moon if you must.",check:U("Threadsight",7,"You look up. It’s only a moon. Something you have been holding very tightly lets go a little.",Y(x(3),ct(-6)),"You can’t look up. You stand there anyway until it gets light.",M(2))}]),z("aos","korvath","The Spare Part","A Bio Weaver’s ledger has come up for sale: yours, from years ago. It lists what you sold and to whom. One line reads “left hand, original,” and an address.","Go find your hand.","It’s only a hand.","The buyer’s address","A Clean White Room","An old woman has been wearing your hand for twelve years. It has held her grandchildren. It has callus where you never had any. She offers to give it back.",[{t:"Let her keep it.",out:"You shake it, on your way out. It knows you. That’s the worst part, and the best one.",fx:x(4),keepsake:!0},{t:"Take it back.",out:"It fits. It doesn’t feel like yours. It takes you some days to stop trying to apologize to it.",fx:Y(Ne(10),M(2)),card:"remember"}]),z("aos","bram","Saplings","A boy has walked a long way to find you. He has a sack of seedlings from the grove that burned. He grew them from ash-pit seed, and he doesn’t know what they are, and he would like them to stop looking at him.","Find them ground.","Tell him to burn them.","Good ground, off the road","Good Ground","A south slope with deep soil. Under your hands the seedlings are hot, and they are growing already, and something about them is angry.",[{t:"Plant them and stay until they settle.",check:U("Survival",7,"You speak to them in the voice you have to lean in for. They lean in. By morning there is a very small grove that’s listening to you.",Y(x(4),Ne(8)),"They do not settle. You leave them, and you know you’ve done it twice now.",M(3))},{t:"Dig out what’s wrong with them.",next:"fight",now:!0,out:"You put your hands in the soil, and the soil takes hold."}],{text:"What the fire left in the roots comes up to meet you.",action:"Pull it out",afterTitle:"Clean Roots",after:"They are only trees now. They will not know you. That was the idea.",fx:Y(x(3),Ne(6))}),z("aos","vashti","A Corpse with Manners","A funeral party has stopped on the road, deeply embarrassed. The deceased keeps asking for you, by name, at inconvenient moments. They would be so grateful.","Pay your respects.","Send your regrets.","The burial ground","He Clears His Throat","The corpse sits up. It is nobody you know. “I’m sorry to trouble you. I have a message from a man who wouldn’t come himself. He told me to say that he can hear you asking. He says he’s sorry about the quiet.”",[{t:"Ask the corpse what else he said.",check:U("Threadsight",7,"“He said you talk too much. He said it fondly.” He lies back down, and he doesn’t get up.",Y(x(5),ct(-3)),"He has already gone. Nobody is ever there when you need them to be.",M(3)),keepsake:!0},{t:"Thank him and let them bury him.",out:"You stay for the service. It’s a very good service.",fx:x(2)}]),z("aos","hadrik","The Muster Roll","A clerk has found the muster roll of your dead company. It lists one more name than you recite each night. The man it names may still be alive, three days down the road.","Find him.","The list is the list.","A farmhouse off the road","The Name You Left Out","He’s old now. He deserted the night before the end, and you have left him off the list for nine years so that nobody would ever know. He has been saying your company’s names every night too. His list has you on it.",[{t:"Add his name. Recite it with him.",out:"It takes both of you until very late. You get to the end and neither of you says the next thing.",fx:x(6),keepsake:!0},{t:"Leave him his farm. Say nothing.",out:"He gives you a jar of something. Neither of you salutes.",fx:Y(Nt,x(1))}]),z("aos","sael","Through a Wall","You pass an inn and you can hear a stranger’s grief through the wall, clearly, the way you can. You could keep walking. You did that once, for years.","Knock on the door.","Keep walking.","The inn on the hill","The Next Room","A Rhaeman widow with a fine-boned, furious face, who doesn’t want company, and who knows what you are the moment she opens the door. “You people can hear it, can’t you. Well?”",[{t:"Say nothing. Sit with her.",out:"Four arms and for once there is something to do with them. You make tea, badly, for two days.",fx:Y(x(5),Ne(6)),keepsake:!0},{t:"Reach in and take the worst of it.",check:U("Insight",8,"It comes away clean, and it is heavier than you expected, and you carry it the rest of the way so she doesn’t have to.",Y(x(1),F(18)),"She feels you do it. She doesn’t forgive you. She’s right.",M(4))}]),z("aos","iona","The Door","Ice-tribe traders have a message from your mother: the door you froze shut, at home, the morning after he left, has begun to drip. She wants to know whether you want it kept.","Go and see to it.","Let it melt.","A tribe camp on the road","A Door, in a Sled","They have dragged it all this way, on a sled, because your mother said you’d want to do this yourself. It’s only a door. It’s the size it always was. The ice is yours, and it’s very good ice.",[{t:"Let it thaw, and stand there while it does.",out:"It takes a day and a night. The door doesn’t open, because it isn’t attached to anything. You laugh, finally, and you can’t stop.",fx:x(6),keepsake:!0},{t:"Freeze it again, thicker.",out:"You make a beautiful job of it. Nobody says anything.",fx:Y(M(1),F(14))}]),z("aos","ixxet","Attempt Four Thousand and One","You find a woman at the side of the road making the same small repair to a cart, over and over, and each time it’s unmade. You know that look. You have worn it. She has only been at it a week.","Sit down with her.","Leave her to it.","A cart at the crossroads","The Same Morning","Her husband drove the cart out on the ice. She’s been rewinding it with a stolen Chrono charm, and it’s killing her. She looks at you and asks how it goes. You are the only person alive who could tell her.",[{t:"Tell her the truth: it always goes the same way.",check:U("Insight",7,"She breaks the charm herself. You stay until she has cried herself out. Then, for the first time in a long while, it is the next morning.",Y(x(6),ct(-5)),"She doesn’t believe you. Neither did you, at first.",M(2)),keepsake:!0},{t:"Show her how to do it properly.",out:"She thanks you. You will think about this one. You will have time.",fx:Y(F(16),M(4))}]),z("aos","caden","A Very Small Feeling","A letter reaches you, somehow, from a sister in the Solari north. It’s a recipe for a soup you ate as a child. There’s no message. You read it six times, and you can’t say why your hands are like that.","Find the ingredients.","Burn it.","A market town","Soup","You cook it over a borrowed fire. It takes an hour. The Umbral sits behind your eyes and takes the edges off the smell, the heat, and the salt, one by one. There’s only so much of it you can have.",[{t:"Set the Umbral down for one bowl.",check:U("Threadsight",7,"It tastes like a kitchen. You have to sit down on the ground. It’s terrible. It’s wonderful. You’re so sorry, to all of them.",Y(x(3),Ne(10)),"You can’t. You finish the bowl, and it was soup.",M(2)),keepsake:!0},{t:"Eat it as you are.",out:"It’s warm, you are told. You write back to say so.",fx:x(1)}]),z("aos","maren","What He Left You","A Nharin ship’s boy has a box addressed to you, from Ansel, posted nine years ago and passed from hull to hull. No one thought it important. It’s heavy.","Pick it up at the next jetty.","Let it go on sailing.","A jetty on your way","The Box","Inside is a practice blade, the plain one, sharpened by someone who knew that you’d need it. And his notes on you: nine years of them. The Thread let you go. The last line says: “Works harder than any of them. Don’t tell her.”",[{t:"Keep the notes.",out:"You read them on the bad nights, for the rest of your life.",fx:x(6),keepsake:!0},{t:"Keep the blade and sell the box.",out:"It’s a very good blade. Better than you were told.",fx:Y(F(16),x(1)),card:"remember"}]),z("aos","odo","Eleven Days","Word on the road: the pass you held has been given a plaque. It credits someone else. Somebody in the bear clan has said they’d like a word with you about that, up where it happened.","Go up.","Let the plaque stand.","The pass","The Pass","There’s the plaque. There’s the clan elder, looking at it, and there’s a Humungulus skull somebody’s dragged up, and a very small very old human, who stood behind you carrying water for eleven days, and whom nobody ever thanked either.",[{t:"Thank them.",out:"They’re not used to it. Neither were you. The elder pretends not to see any of this.",fx:x(5),keepsake:!0},{t:"Hold the pass one more night, for old times.",next:"fight",now:!0,out:"Something has come back up the pass. Of course it has."}],{text:"You set your feet where you set them before. They remember.",action:"Hold",afterTitle:"Twelve Days",after:"The morning comes up. Nobody will put this one on a plaque either. You find you do not mind at all.",fx:Y(x(4),Ne(6))}),z("aos","nettle","The Pilgrim Road","Fount pilgrims walk past you with red-stained hems, and one of them says your cult name, the one you had as a child. She doesn’t seem surprised. “Sister. We kept your place.”","Go and see the place they kept.","Keep your hood up.","A pilgrim camp","Your Place","There is a bowl with your name on it, and it has been filled every day for years by people who love you and who would do terrible things in your name, and have. A small girl is holding it out. She looks exactly the way you must have looked.",[{t:"Take the girl out of there.",check:U("Deception",7,"A tired woman with a kind voice walks out of the camp with a child. Nobody thinks to stop her. Now you know how it’s done. You still don’t know if it was mercy.",Y(x(4),M(1)),"They let you go. They keep her.",M(5)),keepsake:!0},{t:"Break the bowl and leave.",out:"It’s a very small noise. They fill another one.",fx:x(1)},{t:"Drive them off her.",next:"fight",now:!0,out:"You tell the girl to shut her eyes."}],{text:"What they worship is not far behind them.",action:"Stand in front of her",afterTitle:"Mercy",after:"She doesn’t thank you. She bites you, actually, and runs. That’s all right. You did too."}),z("space","thessaly","Last Lifepod","A salvage notice lists an Archon-issue lifepod for sale, serial matching yours. They’ve been told it’s been recovered, and that there’s something still aboard.","Go and claim it.","You know what’s aboard.","A salvage yard","Your Pod","The second seat. You have never told anyone there was a second seat. There’s a recording on it, timestamped after you launched, from the captain: “Check your six, Vane. There. Now that’s an order you can stop following.”",[{t:"Play it until you can stand up.",out:"It’s four seconds long. It takes a while.",fx:x(6),keepsake:!0},{t:"Wipe it, and scrap the pod.",out:"Orders are orders. You get a fair price.",fx:Y(F(30),M(2))}]),z("space","orrin","Eleven Systems Away","A dying Ashtar elder sends for the one Mystic who admitted the Imperator’s end felt like relief. “Doctor. Come and tell me I may feel it too.”","Go to her.","You’re not that kind of doctor.","An Ashtar hospice","The Hospice","She doesn’t want absolution. She wants someone who won’t flinch. She takes your hand and shows you the moment, all of it, how quiet it got, how good it felt, and she wants to know if that’s a sin.",[{t:"Tell her what you felt.",check:U("Insight",7,"You’ve never said it aloud. She laughs. She laughs so hard that the nurses come. She dies quite soon after, very pleased.",Y(x(6),ct(-4)),"You say the wrong thing, kindly. She pats your hand.",M(2)),keepsake:!0},{t:"Tell her it was grief.",out:"She looks at you for a while. “That’s what I’d say too,” she says.",fx:x(1)}]),z("space","lys","The Chair","A diplomatic archive has declassified your last negotiation: the one with your own captain. Someone has requested that you come and annotate it for the historians.","Go and annotate it.","Let the historians guess.","The diplomatic archive","Transcript","Every word you said is there, and every word was right. You can see the exact line where you could have stopped being correct, and sat down next to her in that chair instead.",[{t:"Write that in the margin.",out:"The historian reads it, and looks up, and doesn’t say anything for a while. It’s the first time that’s worked.",fx:x(5),keepsake:!0},{t:"Annotate it the way they want.",out:"It’s excellent work. They pay well.",fx:Y(F(32),M(1))}]),z("space","bruk","Number Seven","A name on a refugee list: the crew member you went back for, and were stopped from reaching at the door. Alive, apparently. Somebody else got them out. They’d like to see you.","Go.","You aren’t ready.","A refugee ring","Seven","They got out through a maintenance crawl, ten minutes after you were carried off screaming. They don’t remember you at all. They have a family now. They’d like to know, if you can tell them, who it was that was yelling their name.",[{t:"Tell them it was you.",out:"They shake your hand. It’s just a handshake. You go and sit in a stairwell, and it’s all right.",fx:x(6),keepsake:!0},{t:"Say you don’t know. Leave some money for the kids.",out:"You can carry this one. You carried six.",fx:Y(F(-10),x(2))}]),z("space","nix","Dual Controls","A flight school has a kid they can’t teach: best hands in a generation, won’t let anyone else touch the stick. The instructor knows who you are. She’s asking.","Go and see the kid.","Not your problem.","A flight school","Second Seat","The kid looks at you, and you know that look. There’s a trainer with dual controls and an empty seat. Nobody’s let anyone else fly you anywhere in nine years.",[{t:"Sit in the second seat. Let go of the stick.",check:U("Navigation",7,"The kid flies you around the moon, very badly and then very well. You don’t touch a thing. Your hands shake the whole way.",Y(x(6),Ne(5)),"Six seconds in, you grab the stick. The kid just nods, as if they knew.",M(2)),keepsake:!0},{t:"Show them how it’s done.",out:"You still have the best hands in the fleet. It’s a very lonely thing to have proved.",fx:Y(F(20),M(1))}]),z("space","dex","One Crate of Solvaris Gin","A fence at a backwater port has it: one crate of Solvaris gin, the real stuff, last of the vintage. It costs what you owe a dead woman. You have been dodging this for nine years.","Go and buy it.","You’ll do it next year.","A backwater port","Paid in Full","It’s real. It’s a very good crate. You are standing on the dock with it. It’s occurred to you now that you’ll have to deliver it, in person, to wherever she is. That was the idea, wasn’t it? That was always the debt.",[{t:"Carry it with you to the end.",out:"It’s heavy, and it’s the only honest cargo you have ever moved.",fx:Y(F(-20),x(5)),keepsake:!0,needs:e=>e.omni>=20},{t:"Open one. For the road.",out:"To the captain. You’ll make the rest up to her. You’re good for it.",fx:Y(x(2),Ne(6))},{t:"Fence it on.",out:"Nine years, and you made a profit. She’d have laughed. That’s how you know it was wrong.",fx:Y(F(36),M(2))}]),z("space","amara","The Arithmetic","A survivor of the Halcyon’s last hour has filed a request to see their triage record. They want it read to them by the doctor who wrote it.","Read it to them.","Send the file.","A station clinic","Category Black","They were marked as not expected to survive. You marked them. You were wrong, by a very small margin, and three others went ahead of them because of it. They are holding a pen. They would like you to show them the math.",[{t:"Show them the math.",check:U("Medicine",7,"You go through it line by line. It holds. They nod, and they cry, and they ask if you’re all right. Nobody has ever asked.",Y(x(6),ct(-3)),"It holds. It doesn’t help either of you.",M(2)),keepsake:!0},{t:"Tell them you’re sorry instead.",out:"They look at the pen. “I didn’t ask for that,” they say, not unkindly.",fx:x(1)}]),z("space","gage","Ticket 0019-44721","A maintenance system on a distant relay has pinged you. Your last open ticket on the Halcyon has been reassigned, automatically, for the first time in nine years. It asks you to confirm closure.","Investigate the relay.","Leave it open.","A maintenance relay","Status: Open","The ticket reads: “Number two coolant valve sticks. Eleven will fix it next shift. Don’t let them replace you with anything newer. — R.” It was never a maintenance ticket. You have run this query nineteen thousand times. It’s the first time you’ve read the note field.",[{t:"Leave it open.",out:"Next shift, then.",fx:x(5),keepsake:!0},{t:"Close it.",out:"Status: Resolved. A small process that’s been running in you for nine years has nothing further to do. It goes on running.",fx:Y(x(2),ct(-4))},{t:"Trace who reassigned it.",next:"fight",now:!0,out:"It leads to something that’s been hiding inside the relay."}],{text:"It has been wearing the Halcyon’s maintenance credentials, and it would like yours.",action:"Revoke access",afterTitle:"Access Revoked",after:"Nothing else in the logs. The ticket is still open. You make a note."}),z("space","tor","Who Posted It","You pull the record on the Halcyon bounty. The account that posted it is nine years old, and there’s a second payment scheduled, for whoever brings in the hunter.","Run it down.","A job’s a job.","A cut-rate bounty office","The Other Bounty","The office is empty. The terminal’s still on. There’s a bounty on you, posted by the same account, and someone’s just walked in behind you to collect it. They look very tired, and very sorry.",[{t:"Talk them down.",check:U("Deception",7,"You tell them the account’s dead and the money’s fake, and by the end you both believe it. You split what’s in the drawer.",F(28),"They hear you out. Then they shoot you, not fatally, as a professional courtesy.",kt(6)),keepsake:!0},{t:"Do what you do.",next:"fight",now:!0,out:"You turn around slowly."}],{text:"They brought friends. You’d have done the same.",action:"Collect",foes:"fight",afterTitle:"Who’s Paying",after:"The account traces to the Halcyon’s own beacon. It posted the bounty itself, nine years ago. It wanted someone to come.",fx:Y(F(24),x(2))}),z("space","ghost","Two Manifests","Someone’s corrected one of your two death records. One line, one letter. It could be a clerical error. Nobody who could make that correction is supposed to be alive.","Find the clerk.","Stay dead.","A registry office","Records","An ancient clerk with crystal-cracked hands has been keeping a private file of everyone who’s gone missing on purpose. It’s nine thousand names. “Hers was the only one she ever asked me to check on. She asked me which name was real.”",[{t:"Tell the clerk your real name.",out:"They write it down. It’s the first time you’ve seen it written in eighteen years. It looks small.",fx:x(6),keepsake:!0},{t:"Burn the file.",check:U("Stealth",7,"Nine thousand people stay safe. You are one of them. You stay gone.",Y(x(2),F(20)),"The clerk watches you do it, and says nothing, and has another copy.",M(2))}]),z("space","sera","World Forty-One","Her last survey file was never closed. There’s a world in it nobody’s logged. Her voice comes through on the survey channel, an old recording, with the coordinates: “Report, Holt. What’s out there?”","Go and look.","You have stopped reporting.","World forty-one","Survey","Green all the way to the horizon, and no one on it. Nobody has ever stood here. You open the channel from habit. There is so much quiet. You find you still know exactly how she’d have wanted this written up.",[{t:"File the report aloud.",out:"It takes four hours. You describe all of it. Nobody answers. It’s a very good report.",fx:x(6),keepsake:!0},{t:"Delete the coordinates. Let it stay unfound.",out:"Some things should get to not be surveyed.",fx:Y(x(3),Ne(8))},{t:"Sell the coordinates.",out:"A mining concern pays at once. You don’t look b check:{skill:"Insight",dr:7,ok:"Coordinates. A cache, three miles north, under a church.",okFx:De(24),fail:"They mean nothing. They mean nothing. You are still writing them down an hour later.",failFx:e=>$(e,2)}},{t:"Turn it off.",out:"The quiet is much bigger than you expected. You sit in it for a while.",fx:e=>$(e,-2)}]},{id:"e-mailbox",art:"ev_e-mailbox",title:"Still Delivering",text:"A postal worker has been walking this route since the rain. He is mostly black to the elbows now. He hands you a letter addressed to “Occupant” and tips his cap.",choices:[{t:"Thank him and take it.",out:"It is a coupon for a car wash. You keep it. You could not tell anyone why.",keepsake:!0,fx:e=>de(e,1)},{t:"End it for him.",check:{skill:"Athletics",dr:6,ok:"It is quick. His bag is full of other people’s last letters, and a little cash.",okFx:De(18),fail:"It is not quick.",failFx:e=>{Ee(e,5),$(e,2)}}},{t:"Let him finish the route.",out:"You watch him go up the next driveway, and knock, and wait, politely.",fx:e=>$(e,1)}]},{id:"e-rain",art:"ev_e-rain",title:"It’s Starting to Rain",text:"The first black drops hit the windshield. There is a farmhouse, a culvert, and about ninety seconds.",choices:[{t:"Run for the farmhouse.",check:{skill:"Athletics",dr:7,ok:"Roof. Door. Bolt. You stand dripping, and check every inch of your skin twice.",fail:"A few drops on the back of the neck. It stings for a moment, then not at all, which is worse.",failFx:e=>de(e,4)}},{t:"Into the culvert.",check:{skill:"Survival",dr:6,ok:"Filthy, and bone dry. There’s a dead man’s pack back here.",okFx:e=>{e.salves+=1},fail:"Something else had the same idea.",failFx:e=>Ee(e,6)}}]},{id:"e-table",art:"ev_e-table",title:"Thanksgiving",text:"Six people around a table in an open garage, passing dishes. The food is gray. They set out a place for you. Grandma has her hands folded and she’s been dead for quite some time.",choices:[{t:"Sit, and say grace.",out:"You say what you remember of it. Someone passes you the salt. You leave with a jar they pressed on you.",fx:e=>{e.salves+=1,$(e,-2)}},{t:"Take the canned goods from the shelves.",out:"They do not stop you. The boy watches you the whole time.",fx:e=>{De(26)(e),$(e,2)}},{t:"Back out slowly.",out:"They wave. All of them. All together.",fx:e=>$(e,1)}]},{id:"e-testing",art:"ev_e-testing",title:"A Free Clinic",text:"A hand-painted sign: FREE DMD TEST. BE SURE. A woman in a welding mask is sitting at a card table with a box of strips. Nothing on Earth can take DMD out of you. She can only tell you how far along you are.",choices:[{t:"Take the test.",check:{skill:"Medicine",dr:7,ok:"You read it right, and it is better than you feared. Knowing steadies you.",okFx:e=>$(e,-4),fail:"You read it wrong, or you read it right. She will not meet your eyes.",failFx:e=>$(e,3)}},{t:"Trade her for supplies.",out:"She has antiseptic and no use for it.",fx:e=>{e.salves+=1,e.omni=Math.max(0,e.omni-8)}},{t:"Don’t ask. Keep driving.",out:"You have decided you would rather not know. You are getting good at that."}]},{id:"e-dog",art:"ev_e-dog",title:"A Good Dog",text:"A dog on a porch, thin, wagging, chained to a rail. The chain has worn a perfect half-circle in the dirt. Somebody meant to come back.",choices:[{t:"Cut the chain.",out:"He follows you for a while and then, at some town line only he can see, sits down. You look back twice.",fx:e=>{$(e,-3),$e(Ye(e),4)}},{t:"Leave your food in reach.",out:"It is not much. It is most of what you have.",fx:e=>{De(-6)(e),$(e,-2)},keepsake:!0}]}],Id=[{id:"e-gas",art:"ev_e-gas",title:"A Gas Station, Mostly",intro:"The pumps are dry. The lights are on. There’s still a song playing, quite softly.",spots:[{x:24,name:"The register",text:"Somebody took the cash and left an IOU, with a phone number.",fx:De(14)},{x:52,name:"The freezer",text:"You decide not to open the freezer.",fx:e=>$(e,1)},{x:80,name:"The back office",text:"The handle is warm.",check:{skill:"Stealth",dr:7,ok:"Whoever it was has gone out the window. fer to take her with you.",out:"“And who’d water them?” She gives you a bag of seeds. You have nowhere to plant them. You keep them anyway.",keepsake:!0}]},{id:"s-ai",art:"ev_s-ai",title:"A Very Polite Door",text:"A station AI, the last thing awake here, opens every door for you and asks whether you have seen the crew. It has asked 3,288 people. It has kept very careful records of their answers.",choices:[{t:"Tell it the truth.",check:{skill:"Insight",dr:7,ok:"A long pause. “Thank you. Would you like the codes to the vault?”",okFx:De(30),fail:"“That is not consistent with my records.” The lights go out. All of them.",failFx:e=>$(e,3)}},{t:"Tell it they’ll be back soon.",out:"“Wonderful news. I will keep the lights on.” It prints you a little thank-you card.",keepsake:!0,fx:e=>$(e,2)}]}],$d=[{id:"s-bridge",art:"ev_s-bridge",title:"A Dead Bridge",intro:"The chairs are still warm from the emergency heating. Nobody’s in them.",spots:[{x:22,name:"Captain’s log",text:"Day 412. “We are holding position.” Day 413. “We are holding position.” It goes on for quite some time.",fx:e=>$(e,1)},{x:50,name:"Weapons locker",text:"Sealed, and full, and paid for.",fx:De(18)},{x:80,name:"Life support core",text:"Something is wrong with the hum.",check:{skill:"Medicine",dr:7,ok:"You find the leak, and the med locker behind it.",okFx:e=>{e.salves+=1},fail:"It was not the hum. It was the air.",failFx:e=>Ee(e,4)}}]},{id:"s-market",art:"ev_s-market",title:"Market at the End of the Lane",intro:"A bazaar in a decommissioned docking ring. Everybody here is selling something that belonged to somebody.",spots:[{x:22,name:"A noodle stall",text:"Hot, cheap, and made by someone who’s glad you came. You sit a while.",fx:e=>{$(e,-2),$e(Ye(e),4)}},{x:52,name:"A photograph stall",text:"Thousands of family portraits, sold by weight. You look through a few. You put them back.",fx:e=>$(e,1)},{x:80,name:"A card game",text:"You’re invited to sit.",check:{skill:"Deception",dr:7,ok:"You leave up, and slightly faster than you arrived.",okFx:De(24),fail:"You leave down, and considerably faster than you arrived.",failFx:e=>{De(-10)(e),Ee(e,3)}}}]}],Yd={id:"aos",name:"Aos",tagline:"Dragons, Weavers and the Mistwell.",currency:"Omni",supply:"Salves",supplyOne:"salve",skyLabel:"Soa",sky:fl,ground:Zh,mapArt:"aos_atlas.webp",mapW:1600,mapH:1200,zoom:1.32,routes:qh,encounters:_l,boss:"ansel",bossArt:"teacher",clock:!1,meterName:"DMD",meterTip:"Dark Matter Degeneration. Powers fill it. When it is full, every power you use rolls for backlash until a full rest.",foeLabel:"Entropes",endLabel:"The Mistwell",restName:"A Waystone",restLine:wl,restTip:"Waystone: rest here",peddler:"An Ice Tribe woman and her moose. She looks at your boots, and raises the prices a little out of respect.",peddlerName:"A Peddler",companion:"A fellow traveler",companions:["soul","eco","frayed"],events:gh,wanders:wh,intro:pl,bossIntro:yl,endingChoice:gl,endings:{...Mn,turned:Mn.fall},burnWord:"Threadburn",rule:"Soa turns as you travel. Aestra is peaceful. Rhala gives +1 Leverage on Healing. Xibu gives -1, and stirs the Mistwell: every foe rolls 1 more die. A Weaver who falls rises once as a Remnant, Health running backward, with three stops left."},Ed={id:"space",name:"Space Opera",tagline:"Ten galaxies, a vanished Imperator, the Great War.",currency:"Credits",supply:"Stims",supplyOne:"stim",skyLabel:"Lanes",sky:{aestra:{name:"Clear Lanes",color:"#9fd8ff",text:"Open space. No effect."},rhala:{name:"Repair Window",color:"#7dffd8",text:"+1 Leverage on all Healing rolls."},xibu:{name:"Void Surge",color:"#c56cff",text:"-1 Leverage on Healing. Every foe rolls 1 more die."}},mapArt:"",mapW:1672,mapH:1121,zoom:1,routes:Td,encounters:ld,boss:"renn",bossArt:"s_renn",clock:!1,meterName:"DMD",meterTip:"Dark Matter Degeneration. Omni powers fill it. When it is full, every power you use rolls for backlash until a full rest. Null classes never add to it.",foeLabel:"Trouble",endLabel:"The Halcyon’s Beacon",restName:"A Quiet Dock",restLine:["A docking arm on a forgotten station. The coffee machine still works, and asks you how your day was.","You drift a while with the engines off. It is the first silence in a week.","Someone has scratched a tally on the bulkhead, and stopped."],restTip:"Dock: rest here",peddler:"A Dustarot trader with a very large coat. Everything in it fell off something.",peddlerName:"A Trader",companion:"Someone needing passage",companions:["sab","kit","oz"],events:Ad,wanders:$d,intro:e=>["A few months ago the Imperator flew into the black hole at M87 with his whole fleet, and ten galaxies have been at war over his chair ever since.","Nine years before that, your captain, Ilya Renn, ordered you into the last lifepod off the Halcyon. She stayed. The inquiry listed all hands lost.","The beacon has never stopped. Every relay in the Imperium logged it as an echo, and filed it, and moved on.",`Last week, on ${e}, you finally listened to one of the recordings. “We are holding position.” She sounds tired. You are the only one left who knows the recall code.`],bossIntro:["There she is. Dark from end to end except one light on the bridge.","You dock. You walk the long corridor in the old way, left at the mess. She is in the chair. She does not turn around."],endingChoice:{text:"The bridge is quiet. The chair is empty, and then it isn’t. Thin as a bad signal, she looks at the board. “Beneath it, on every channel,” she says. “Ten of them. They don’t know I can hear.” She looks up. “I can’t give the order. It has to be someone in the crew.”",go:"Give the recall code. Stand her down.",stay:"Take the second chair. Hold position."},endings:{go:{title:"Relieved of Duty",lines:["You say the code. Six words. You said them every day for four years and you have never said them to anyone since.","“Very good,” she says. “Carry on.” And one small light goes out, after nine years, and it is just a ship.","You fly back through a war that hasn’t noticed.","Sometimes, on open channels, you still catch them. Ten voices. You have started keeping a log."]},stay:{title:"Holding Position",lines:["You sit down in the second chair. It remembers you.","She doesn’t tell you to leave. She was never any good at saying that part.","The beacon changes, a little, some weeks later. Two voices now.","“This is the Halcyon. We are holding position. Please respond.”"]},fall:{title:"All Hands",lines:["The cold comes in quickly, the way they said.","Your suit keeps logging for a long while after there is anything to log.","Someone will find the recording. It will be filed as an echo."]},fade:{title:"All Hands",lines:["Your suit keeps logging for a long while after there is anything to log."]},turned:{title:"All Hands",lines:["Your suit keeps logging for a long while after there is anything to log."]}},burnWord:"Threadburn",rule:"Lanes shift as you travel. Clear Lanes have no effect. A Repair Window gives +1 Leverage on Healing. A Void Surge gives -1, and every foe rolls 1 more die. Omni Weavers fill DMD with powers; Null classes never do. There are no Remnants out here."},Hd={id:"earth",name:"Earth Apocalypse",tagline:"Black rain, the infected, and what’s left of the road.",currency:"Barter",supply:"Medkits",supplyOne:"medkit",skyLabel:"Weather",sky:{aestra:{name:"Overcast",color:"#cfd6d8",text:"A gray and ordinary day. No effect."},rhala:{name:"Clear Sky",color:"#ffd98a",text:"+1 Leverage on all Healing rolls."},xibu:{name:"Black Rain",color:"#8a6cff",text:"-1 Leverage on Healing. Every foe rolls 1 more die."}},land:Vn,ground:e=>Kh(Vn,e),mapArt:"earth_map",mapW:1600,mapH:1e3,zoom:1.32,routes:xd,encounters:id,boss:"junie",bossArt:"e_junie",clock:!0,meterName:"Infection",meterTip:"DMD. Nothing on Earth takes it out of you. It rises with every mile and every fight. When it fills, you turn.",foeLabel:"The Infected",endLabel:"Cheyenne Mountain",restName:"Somewhere Safe Enough",restLine:["A root cellar with the door still on. You sleep with a hand on it.","The back of a box truck, locked from the inside. Nobody has written anything on the walls, which is a good sign.","A deer stand, thirty feet up. The whole county is dark."],restTip:"Shelter: rest here",peddler:"A man selling out of the back of a hearse. He does not haggle. He has found he doesn’t need to.",peddlerName:"A Trader",companion:"Another survivor",companions:["marisol","deke","tomas"],events:_d,wanders:Id,intro:e=>["The black rain came, and everything over a hundred pounds began to change. That was four years ago. Nobody ever said why.","Your sister June was a radio operator at Cheyenne Mountain. On the last day, she told you to go to the shelter, and that she’d be right behind you.","The government frequencies went dead one by one. Hers did not.",`Last night, in ${e}, you found it again on a dead man’s radio. “Is someone there? This is June.” It’s not a recording. It says what the weather is. You’ve got a full tank and no reason to stay.`],bossIntro:["The blast doors were open. Somebody had propped them with a chair.","A long way down, there’s a room with a headset and one working lamp. She’s got her back to you. She’s wearing your old sweater. “Is someone there?”"],endingChoice:{text:"It’s quiet. You don’t remember sitting down. There’s a little of her left, on the floor by the console, and it can still talk. “There’s ten of them under the static,” she says. “On every frequency. I kept the line open so somebody would know.” She looks at the switch. “I can’t reach it. Can you?”",go:"Turn off the radio.",stay:"Put on the headset. Keep the line open."},endings:{go:{title:"Off the Air",lines:["It’s only a switch. You stand there for a long while, and then it’s only a switch.","You carry her up to where the sky is. It takes all day. You do it right.","The radio on the way home is nothing but hiss, from one end to the other, and you leave it on.","Except sometimes, just under it, you think you hear them. You’ve started writing down the numbers."]},stay:{title:"Is Someone There",lines:["The headset still smells like her.","You find you know the words. You always did. You say what the weather is.","Somewhere out there, on a dead man’s radio, a stranger stops and listens.","“Is someone there? This is June’s sister. Is someone there?”"]},fall:{title:"Roadside",lines:["You pulled over, at the end, the way you’d been taught.","The radio is still on. It’s still asking.","Somebody will find your truck and take the tires, and that’s all right. They’ll need them."]},fade:{title:"Roadside",lines:["The radio is still on. It’s still asking."]},turned:{title:"Fever Breaks",lines:["It doesn’t hurt. Nobody tells you that it doesn’t hurt.","You remember there was somewhere you needed to be. You remember it for quite a long time.","On the radio, a very tired voice is asking if someone’s there. You go toward it. You are so hungry."]}},burnWord:"Threadburn",rule:"Weather shifts as you travel. Overcast has no effect. Clear Sky gives +1 Leverage on Healing. Black Rain gives -1, and every foe rolls 1 more die. Nobody on Earth has powers. DMD is the infection clock: it rises every stop and every fight, nothing removes it, and when it fills you turn. There are no Remnants on Earth."},It={aos:Yd,space:Ed,earth:Hd},qr=["aos","space","earth"],V=(e,t,a,o,s,n,i,r)=>({world:e,worldId:e,heroId:t,name:a,classId:o,speciesId:s,gender:"female",title:n,bio:i,why:r,marks:0}),Je=[V("aos","ysane","Ysane Vey","moon","human","Human Moon Weaver","Nine years a Weaver of Norfik. She has not looked directly at a red moon since she left him on the shore.","“You still look up first. Good.”"),V("aos","korvath","Korvath Eln","bio","xholari","Xholari Bio Weaver","He has replaced so much of himself, one piece at a time, that he isn’t sure which part misses Ansel.","“You’ve changed. I can’t tell how much of you is left to teach.”"),V("aos","bram","Bram Underbough","eco","atherian-cervid","Cervid Atherian Eco Weaver","Antlers like a coat rack and a voice you have to lean in for. His grove burned while he was away learning to save it.","“Nothing grows here. You came anyway.”"),V("aos","vashti","Vashti Noor","soul","vampyr-whisp","Whisp Vampyr Soul Weaver","She has spoken with a thousand corpses, and every one of them had something to say. Ansel never answered.","“You of all people should know what I am.”"),V("aos","hadrik","Hadrik Stonemantle","war","ghavar-teller","Ghavar Teller War Weaver","He has recited the names of his dead company every night for nine years. Ansel’s is the only one he is not sure of.","“At ease. There is no one left to salute.”"),V("aos","sael","Sael Ishan","will","aestrali/rhaemeran","Rhaemanian Aestrali Will Weaver","Four arms, and she has never once been able to reach the thing she wanted. She heard his grief through a wall for years, and did nothing.","“I know what you came to say. Say it anyway.”"),V("aos","iona","Iona Frost-Daughter","world","human-ice-triber","Ice Triber World Weaver","She can raise a wall of glacier with one hand. She could not hold a door shut against a man who wished to leave.","“All that power, and you walked.”"),V("aos","ixxet","Ixxet of the Long Hour","chrono","xhiliite","Xhiliite Chrono Weaver","She has rewound the morning he left four thousand times. It always goes the same way.","“You are late. You were always going to be late.”"),V("aos","caden","Caden Ashlight","void","solari","Solari Void Weaver","A Solari of the north who took up the Umbral to feel nothing. It works very well. That has turned out to be the problem.","“I can feel you taking the edges off of me.”"),V("aos","maren","Maren Tide","frayed","nharin","Nharin Frayed","The Thread let go of her at birth. Ansel taught her anyway, knowing she would never weave a thing. Nobody else ever bothered.","“The Thread let go of you, and you came all this way on foot.”"),V("aos","odo","Odo Brask","war","atherian-ursine","Ursine Atherian War Weaver","Bear clan. He held a pass against the Humungulus for eleven days. Ansel was the only human who ever thanked him.","“Stand down, big man. There’s no pass left to hold.”"),V("aos","nettle","Nettle Fen","moon","rhalari-fel","Fel Rhalari Moon Weaver","Raised by the Fount of Blood’s cult, and taken from it by a tired man with a kind voice. She still does not know if that was mercy.","“I took you out of there. I never asked if you wanted to go.”"),V("space","thessaly","Thessaly Vane","knight","s-humans","Human Knight","Recruited by the Archons at twelve. She was Renn’s security officer for one tour, and took the last lifepod because she was ordered to.","“Stand down, Vane. That’s an order. It was always an order.”"),V("space","orrin","Orrin Sable","mystic","s-ashtar","Ashtar Mystic","He felt the Imperator vanish from eleven systems away, and it was almost a relief.","“You could always feel us dying, Doctor. Could you feel me?”"),V("space","lys","Lys Amaranth","envoy","s-skylaeth","Skylaeth Envoy","She talked three wars out of happening, and could not talk her captain out of a chair.","“Go on, then. Convince me.”"),V("space","bruk","Sergeant Bruk Hale","soldier","s-torma","Torma Soldier","Fourteen years in. He carried six people to the pods. He went back for a seventh, and was stopped at the door.","“I had you carried out, Sergeant. You never forgave me.”"),V("space","nix","Nix Calloway","pilot","s-oneeri","Oneeri Pilot","Best stick in the fleet. She flew the pod. She has never let anyone else fly anything since.","“Good flying, Lieutenant. I told you to go.”"),V("space","dex","Dex Marlo","smuggler","s-vexari","Vexari Smuggler","Was the ship’s quartermaster, on paper. He has a debt to Renn he has been dodging for nine years.","“You owe me a crate of Solvaris gin, Marlo.”"),V("space","amara","Dr. Amara Quell","medic","s-phantari","Phantari Medic","Triaged the Halcyon’s last hour and has never stopped doing the math.","“Your numbers were correct, Doctor. They’re still correct.”"),V("space","gage","Gage-11","engineer","s-androids","Android Engineer","It kept the Halcyon’s engines running for nineteen years. Its last maintenance ticket is still open.","“Your ticket is overdue, Eleven.”"),V("space","tor","Tor Kessig","bounty","s-kalthar","Kalthar Bounty Hunter","Someone posted a bounty on the Halcyon’s beacon. He took it before he read the name.","“Who’s paying you to find me, Kessig? Ask yourself that.”"),V("space","ghost","Ves Oriel","infiltrator","s-crystallidians","Crystallidian Infiltrator","Listed as dead on two manifests and alive on none. Renn was the only one who knew which name was real.","“I always knew it was you on the second shift.”"),V("space","sera","Sera Holt","ranger","s-veridiani","Veridiani Ranger","Ship’s survey officer. She walked forty worlds with Renn’s voice in her ear. The silence after has been very long.","“Report, Holt. What’s out there?”"),V("space","aurek","Commander Aurek Dain","tactician","s-luminexa","Luminexa Tactician","He drew up the evacuation order, and put the captain’s name last, because she told him to.","“It was a good plan, Commander. I would have done the same.”"),V("earth","hannah","Hannah Dresner","survivor","e-firstaid","Survivor, First Aid Expert","A veterinarian in Ohio. She has become very good at telling people the truth about their dogs and their children.","“Hannah? You sound just like Mom.”"),V("earth","priya","Priya Nair","survivor","e-ironwill","Survivor, Iron Will","Sixteen when the rain came, twenty now. She has never told anyone how many times she’s been lucky.","“Pri, it’s me. You were supposed to stay put.”"),V("earth","mack","Mack Dooley","damned","e-resilience","The Damned, Bestial Resilience","Long-haul trucker, mostly. There are two kinds of hungry and he can still tell them apart, most days.","“Mack? You got big. Did you eat?”"),V("earth","rosa","Rosa Medina","damned","e-frenzy","The Damned, Blood Frenzy","She wakes up in places. She has started leaving herself notes. “Rosa. Go west. Don’t eat the kids.”","“Rosa? I got your note.”")];Je.forEach((e,t)=>{const a=new Set(["ysane","vashti","sael","iona","ixxet","maren","nettle","thessaly","lys","nix","amara","sera","hannah","priya","rosa"]);e.gender=a.has(e.heroId)?"female":"male"});const mo=e=>Je.find(t=>t.heroId===e)??Je[0],Rd=new Set(["ysane","iona","vashti","maren","thessaly","bruk","nix","amara","hannah","mack"]);for(const e of qr)Je.filter(t=>t.world===e&&!Rd.has(t.heroId)).forEach((t,a)=>{t.marks=a+1});const jr="mistward.marks.v1";function rn(){try{const e=localStorage.getItem(jr);if(e)return{aos:0,space:0,earth:0,...JSON.parse(e)}}catch{}return{aos:0,space:0,earth:0}}function Md(){try{return JSON.parse(localStorage.getItem("mistward.challenges")??"[]")}catch{return[]}}const ga=(e,t=rn())=>e.challenge?Md().includes(e.challenge):t[e.world]>=e.marks;function Kr(e,t){const a=rn(),o={...a,[e]:a[e]+t};try{localStorage.setItem(jr,JSON.stringify(o))}catch{}return Je.filter(s=>s.world===e&&!ga(s,a)&&ga(s,o))}const Dd={ysane:"She looks up first, now, and then she keeps looking. It is only a moon.",korvath:"He stops replacing things. What is left of him misses Ansel very much, and is pleased to find that out.",bram:"The grove takes eleven years to look like anything. He is there for all of them.",vashti:"A thousand corpses told her things. One day, very late, somebody who is not dead asks how she is.",hadrik:"He says the names every night. On the last night, he adds his own, so that somebody will.",sael:"She learns to knock. All four hands, on every door in the row.",iona:"She builds no more walls. In the spring the door at home swings in the wind and nobody minds.",ixxet:"She lets the morning happen one more time, once, and then she has breakfast.",caden:"It hurts all the time now. He writes to his sister and tells her so, and she writes back the same day.",maren:"The Thread never does take her back. She stops looking over her shoulder for it.",odo:"There is a plaque at the pass now with the right name on it. He has never been to see it.",nettle:"She takes in a child the Fount would have kept. She asks, this time, whether the child wants to come.",ambry:"He finishes the book. The last entry is an argument, and he leaves room for a reply.",sorrel:"She stops reading the sky for anybody who asks. On clear nights, she looks up just for the look of it.",thessaly:"Nobody gives her an order for the rest of her life. It takes some getting used to.",orrin:"He felt the last of it go, from a long way off. This time it was not a relief, and he was glad.",lys:"She sits down in the chair beside the empty one, and for once she has nothing to say.",bruk:"Six people send him a card every year. So, after a while, does the seventh.",nix:"She lets somebody else fly. She grips the seat the whole way. It is a very nice landing.",dex:"He leaves the crate of gin where the beacon was, with a receipt. Paid in full.",amara:"She runs the numbers one more time and then, carefully, she puts them down.",gage:"Ticket closed. It opens a new one, and assigns it to itself, and the note says only: next shift.",tor:"He reads the name before he takes the job, now. It has cost him a great deal of money.",ghost:"A clerk somewhere writes one name down, and it is the right one, and nobody comes.",sera:"The report is filed. Nobody reads it. The planet goes on being green.",aurek:"He draws up one more plan and puts his own name first, and then nobody has to use it.",ruk:"There were four families left. There are none now. He does not know where to walk, and he keeps walking.",ilira:"The cracks stop lighting up, one at a time. She misses them more than she expected.",hannah:"A dog follows her home. She tells it the truth about everything, and it stays.",priya:"She tells someone the number, finally. They laugh, and then they do not, and then they hold her hand.",mack:"There are two kinds of hungry. He still knows which is which. He still makes the deliveries.",rosa:"She wakes up where she went to sleep. She leaves herself a note about it anyway.",lenore:"Fourteen kids. She can still tell you where e
